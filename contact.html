<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sajilo Bus Ticket Booking System</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
    
</head>

<body>

<header class="header">

    <div class="logo-section">
        <img src="bus3.jpg" class="logo" alt="Logo">

        <div class="title">
            <h1>Sajilo Bus</h1>
            <p>Travel Smart ! Travel Safe</p>
        </div>
    </div>



<nav class="navbar">
    <a href="index.html" >Home</a>
    <a href="main.html">About</a>
    <a href="routes.html">Routes</a>
    <a href="booking.html" >Book Ticket</a>
    <a href="contact.html" class="active">Contact</a>
       <button id="theme-btn" onclick="toggleTheme()">🌙</button>
    </nav>
    </header>
    <section class="contact-section">

    <div class="contact-box">

        <h1>Contact Us</h1>
        <p>Have questions or need assistance? Send us a message.</p>

        <form onsubmit="return contactForm()">

            <div class="contact-group">
                <label>Full Name</label>
                <input type="text"
                       id="name"
                       placeholder="Enter your full name"
                       required
                       minlength="3">
            </div>

            <div class="contact-group">
                <label>Email</label>
                <input type="email"
                       id="email"
                       placeholder="example@gmail.com"
                       required>
            </div>

            <div class="contact-group">
                <label>Phone Number</label>
                <input type="tel"
                       id="phone"
                       placeholder="98XXXXXXXX"
                       pattern="[9][8][0-9]{8}"
                       required>
            </div>

            <div class="contact-group">
                <label>Subject</label>
                <input type="text"
                       id="subject"
                       placeholder="Subject"
                       required>
            </div>

            <div class="contact-group">
                <label>Message</label>
                <textarea id="message"
                          rows="6"
                          placeholder="Write your message..."
                          required></textarea>
            </div>

            <button type="submit" class="contact-btn">
                Send Message
            </button>

        </form>

        <div id="snackbar"></div>

    </div>

</section>



</body>
</html>
